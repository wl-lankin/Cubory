<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Passwort zurücksetzen - Cubory</title>
<link rel="icon" href="assets/icon.png?v=2" />
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="/assets/fonts/fonts.css" />
<style>
:root{--text:#eef0ff;--muted:#9aa3d0;--faint:#5d668f;--a1:#ff3d8a;--a2:#7c5cff;--border:rgba(160,170,255,.22)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;color:var(--text);min-height:100vh;padding:60px 24px;
display:flex;align-items:center;justify-content:center;
background:radial-gradient(900px 600px at 85% -10%,rgba(255,61,138,.12),transparent 60%),
linear-gradient(180deg,#070b22,#0a0e2a 40%,#0d1233)}
.sheet{position:relative;width:min(440px,92vw);border:1px solid var(--border);padding:44px 40px;
background:repeating-linear-gradient(0deg,transparent 0 39px,rgba(160,170,255,.04) 39px 40px),
repeating-linear-gradient(90deg,transparent 0 39px,rgba(160,170,255,.04) 39px 40px),rgba(10,14,42,.5)}
.sheet::before,.sheet::after{content:"";position:absolute;width:14px;height:14px;border:1px solid rgba(160,170,255,.5)}
.sheet::before{top:-7px;left:-7px;border-width:0 1px 1px 0}
.sheet::after{bottom:-7px;right:-7px;border-width:1px 0 0 1px}
.label{position:absolute;top:-9px;left:24px;background:#0a0e2a;padding:0 10px;
font-family:ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.2em;color:var(--faint)}
h1{font-family:'Space Grotesk';font-size:22px;margin-bottom:8px}
p{font-size:13.5px;line-height:1.7;color:var(--muted);margin-bottom:18px}
input{width:100%;font:500 14px Inter,sans-serif;color:var(--text);background:rgba(10,14,42,.6);
border:1px solid rgba(160,170,255,.2);border-radius:10px;padding:12px 14px;margin-bottom:10px;outline:none}
input:focus{border-color:var(--a1)}
button{width:100%;font:600 14px Inter,sans-serif;color:#fff;border:none;border-radius:999px;padding:13px;
background:linear-gradient(92deg,var(--a1),var(--a2));cursor:pointer;box-shadow:0 6px 24px rgba(255,61,138,.35)}
button:disabled{opacity:.5;cursor:default}
.msg{font-size:13px;margin-top:12px}
.msg.err{color:#ff8ba0}
.msg.ok{color:#7dffb0}
a{color:var(--a1);text-decoration:none}
</style>
</head>
<body>
<div class="sheet">
  <span class="label">CUBORY · KONTO</span>
  <h1 data-de="Neues Passwort setzen" data-en="Set a new password">Neues Passwort setzen</h1>
  <p data-de="Wähle ein neues Passwort für dein Cubory-Konto (mindestens 10 Zeichen)."
     data-en="Choose a new password for your Cubory account (at least 10 characters).">
     Wähle ein neues Passwort für dein Cubory-Konto (mindestens 10 Zeichen).</p>
  <form id="f">
    <input id="pw" type="password" minlength="10" required
      data-de-ph="Neues Passwort" data-en-ph="New password" placeholder="Neues Passwort" />
    <input id="pw2" type="password" minlength="10" required
      data-de-ph="Passwort wiederholen" data-en-ph="Repeat password" placeholder="Passwort wiederholen" />
    <button id="go" data-de="Passwort speichern" data-en="Save password">Passwort speichern</button>
  </form>
  <p class="msg" id="msg" hidden></p>
</div>
<script>
const API = location.hostname.endsWith('.test') || location.hostname === 'localhost'
  ? 'http://localhost:8880' : 'https://api.cubory.app';
const token = new URLSearchParams(location.search).get('token');
const en = (new URLSearchParams(location.search).get('lang') || navigator.language || 'de').slice(0,2) !== 'de';
if (en) {
  document.documentElement.lang = 'en';
  document.querySelectorAll('[data-en]').forEach((n) => n.textContent = n.dataset.en);
  document.querySelectorAll('[data-en-ph]').forEach((n) => n.placeholder = n.dataset.enPh);
}
const msg = document.getElementById('msg');
const show = (text, ok) => { msg.textContent = text; msg.className = 'msg ' + (ok ? 'ok' : 'err'); msg.hidden = false; };
const T = (de, enTxt) => en ? enTxt : de;

if (!token) show(T('Ungültiger Link - fordere in der App einen neuen an.', 'Invalid link - request a new one in the app.'), false);

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!token) return;
  const pw = document.getElementById('pw').value;
  if (pw !== document.getElementById('pw2').value) {
    show(T('Die Passwörter stimmen nicht überein.', 'Passwords do not match.'), false);
    return;
  }
  document.getElementById('go').disabled = true;
  try {
    const res = await fetch(API + '/api/auth/reset-password', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ token, password: pw }),
    });
    if (res.status === 204) {
      show(T('Passwort geändert - du kannst dich jetzt in der App anmelden.', 'Password changed - you can now sign in in the app.'), true);
      document.getElementById('f').style.display = 'none';
    } else {
      const d = await res.json().catch(() => ({}));
      show(d?.error?.message || T('Link ungültig oder abgelaufen.', 'Link invalid or expired.'), false);
      document.getElementById('go').disabled = false;
    }
  } catch {
    show(T('Server nicht erreichbar - bitte später erneut versuchen.', 'Server unreachable - please try again later.'), false);
    document.getElementById('go').disabled = false;
  }
});
</script>
</body>
</html>
