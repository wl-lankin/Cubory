<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cubory - The modern CAD viewer</title>
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <div id="app">
    <header id="titlebar">
      <div class="brand">
        <img id="brand-icon" class="brand-mark" alt="" />
        <img id="brand-wordmark" class="brand-wordmark" alt="Cubory" />
        <span class="brand-sub">The modern CAD viewer</span>
      </div>
      <div class="titlebar-actions">
        <button id="btn-account" class="btn btn-ghost btn-account"></button>
        <button id="btn-open-top" class="btn btn-ghost" data-i18n="app.open" data-i18n-title="app.openTip"></button>
        <button id="btn-settings" class="btn btn-ghost btn-icon" data-i18n-title="settings.title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
        <button id="btn-about" class="btn btn-ghost btn-icon" data-i18n-title="about.title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></button>
      </div>
    </header>

    <div id="tabbar" hidden></div>

    <main id="workspace">
      <aside id="sidebar" class="glass sheet sheet-corners" hidden>
        <section class="panel">
          <h2 class="panel-title" data-i18n="panel.model"></h2>
          <dl id="model-info" class="info-list"></dl>
        </section>
        <section class="panel" id="layers-panel" hidden>
          <h2 class="panel-title" id="layers-title"></h2>
          <ul id="layers-list" class="layers-list"></ul>
        </section>
      </aside>

      <section id="viewport-wrap">
        <div id="viewport"></div>

        <div id="dropzone" class="dropzone">
          <div class="hero">
            <p class="hero-eyebrow">DXF · DWG · STEP · STP · IGES · STL · OBJ</p>
            <h1 class="hero-title"><span data-i18n="hero.title1"></span><br /><span class="grad-text" data-i18n="hero.title2"></span></h1>
            <p class="hero-sub"><span data-i18n="hero.sub1"></span><br /><span data-i18n="hero.sub2"></span></p>
            <div class="hero-actions">
              <button id="btn-open" class="btn btn-primary"><span data-i18n="hero.cta"></span>&nbsp;&nbsp;→</button>
              <span class="hero-hint" data-i18n="hero.hint"></span>
            </div>
          </div>
        </div>

        <div id="toolbar" hidden>
          <div class="tool-group glass">
            <button class="tool" data-action="fit" data-i18n="tool.fit" data-i18n-title="tool.fitTip"></button>
            <button class="tool" data-action="iso" data-i18n="tool.iso" data-i18n-title="tool.isoTip"></button>
            <button class="tool" data-action="top" data-i18n="tool.top" data-i18n-title="tool.topTip"></button>
            <button class="tool" data-action="front" data-i18n="tool.front" data-i18n-title="tool.frontTip"></button>
            <button class="tool" data-action="right" data-i18n="tool.right" data-i18n-title="tool.rightTip"></button>
          </div>
          <div class="tool-group glass">
            <button class="tool toggle" data-action="grid" data-i18n="tool.grid" data-i18n-title="tool.gridTip"></button>
            <button class="tool toggle" data-action="wireframe" data-i18n="tool.wireframe" data-i18n-title="tool.wireframeTip"></button>
            <button class="tool toggle" data-action="edges" data-i18n="tool.edges" data-i18n-title="tool.edgesTip"></button>
            <button class="tool" data-action="hdshot" id="tool-hdshot" data-i18n="tool.hdshot" data-i18n-title="tool.hdshotTip"></button>
          </div>
          <div class="tool-group glass">
            <button class="tool toggle pro-tool" data-action="measure" id="tool-measure" data-i18n="tool.measure" data-i18n-title="tool.measureTip"></button>
            <button class="tool toggle pro-tool" data-action="section" id="tool-section" data-i18n="tool.section" data-i18n-title="tool.sectionTip"></button>
            <button class="tool toggle pro-tool" data-action="explode" id="tool-explode" data-i18n="tool.explode" data-i18n-title="tool.explodeTip"></button>
            <button class="tool pro-tool" data-action="export" id="tool-export" data-i18n="tool.export" data-i18n-title="tool.exportTip"></button>
          </div>
        </div>

        <div id="feature-panel" class="glass" hidden></div>
        <div id="measure-labels"></div>

        <div id="loading" class="loading glass" hidden>
          <div class="spinner"></div>
          <span id="loading-text"></span>
        </div>

        <div id="drop-overlay" hidden><div class="drop-overlay-inner glass" data-i18n="drop.here"></div></div>
      </section>
    </main>

    <footer id="statusbar" hidden>
      <span id="status-format" class="badge"></span>
      <span id="status-entities"></span>
      <span id="status-size"></span>
      <span class="status-spacer"></span>
      <span id="status-hint"></span>
    </footer>
  </div>
</body>
</html>
