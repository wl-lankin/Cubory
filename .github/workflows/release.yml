# Builds the installers for macOS, Windows and Linux and attaches them to a DRAFT GitHub release.
# Installed apps only see the update once the draft is published. Trigger: push a tag like v2.0.0
# (see docs/RELEASE.md).
#
# Every installer is attached twice: with the version in the name (referenced by the latest*.yml
# files electron-updater reads) and under a stable name, so the website can always link to
# releases/latest/download/<stable name>.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  TAG: ${{ github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            flag: --mac
          - os: windows-latest
            flag: --win
          - os: ubuntu-latest
            flag: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Tag passt zur Version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          base="${TAG#v}"; base="${base%%-*}"
          [ "$base" = "$version" ] || { echo "Tag $TAG passt nicht zu package.json ($version)"; exit 1; }

      # cubory-core is private; this deploy key can only read that one repository.
      - name: Zugang zum privaten Paket
        shell: bash
        env:
          CUBORY_CORE_KEY: ${{ secrets.CUBORY_CORE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$CUBORY_CORE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global core.sshCommand "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new"

      - run: npm ci
      - run: npx vite build
      - name: Installer bauen
        run: npx electron-builder ${{ matrix.flag }} --publish never
        env:
          # No Apple certificate yet; without this electron-builder aborts.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/download-artifact@v8
        with:
          path: out
          pattern: installer-*
          merge-multiple: true

      - name: Feste Dateinamen
        run: |
          # Exact names from electron-builder; cp fails the job if one is missing.
          # The website links to the stable names, so never change them.
          v=$(node -p "require('./package.json').version")
          cd out
          cp "Cubory-$v-arm64.dmg" Cubory-macOS-AppleSilicon.dmg
          cp "Cubory-$v.dmg" Cubory-macOS-Intel.dmg
          cp "Cubory-Setup-$v.exe" Cubory-Windows-Setup.exe
          cp "Cubory-$v.AppImage" Cubory-Linux.AppImage
          ls -l

      - name: Draft-Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release-notes.mjs "${TAG#v}" > notes.md
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" out/* --draft $prerelease --title "Cubory ${TAG#v}" --notes-file notes.md
