name: CI & Release

# Auf dev und in Pull Requests laufen nur die Tests. Landet etwas auf main
# (also beim Merge von dev), kommen Build und Rollout dazu.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Nur Leserechte. paths-filter braucht in Pull Requests zusätzlich Zugriff auf
# die Dateiliste des PR - die holt es über die API, nicht über den Git-Verlauf.
permissions:
  contents: read
  pull-requests: read

# Zwei parallele Rollouts würden sich auf dem Server gegenseitig überschreiben.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DEPLOY_HOST: 91.98.161.167
  DEPLOY_USER: deploy
  WEBROOT: /var/www/cubory

jobs:
  # Nur bauen, was sich geändert hat - ein Website-Tippfehler soll keine
  # teure macOS-Buildzeit kosten.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      website: ${{ steps.filter.outputs.website }}
      backend: ${{ steps.filter.outputs.backend }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'src/**'
              - 'electron/**'
              - 'assets/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.js'
            website:
              - 'website/**'
            backend:
              - 'backend/**'
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Unit-Tests
        run: npm test

      # Electron braucht auf dem Runner einen Bildschirm und ein paar
      # Systembibliotheken, die im Standard-Image fehlen.
      - name: Umgebung für den Rauchtest
        if: needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgbm1 libnss3 libasound2t64 libgtk-3-0t64 \
            || sudo apt-get install -y -qq xvfb libgbm1 libnss3 libasound2 libgtk-3-0

      - name: Rauchtest der App
        if: needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
        run: xvfb-run -a npm run test:e2e

      - name: Backend-Tests
        if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: go test
        if: needs.changes.outputs.backend == 'true'
        working-directory: backend
        run: go test ./...

  build:
    needs: [changes, test]
    if: |
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      && (needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            flag: --mac
          - os: windows-latest
            flag: --win
          - os: ubuntu-latest
            flag: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx vite build
      - name: Installer bauen
        run: npx electron-builder ${{ matrix.flag }} --publish never
        env:
          # Ohne Apple-Zertifikat würde electron-builder sonst abbrechen.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml

  deploy:
    needs: [changes, test, build]
    if: |
      !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      && needs.test.result == 'success' && needs.build.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: SSH einrichten
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Hostschlüssel fest hinterlegt statt per keyscan - sonst würde die
          # Pipeline jeden Server akzeptieren, der gerade antwortet.
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Website synchronisieren
        if: needs.changes.outputs.website == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          rsync -rlv --delete --exclude 'downloads/' --chmod=D2775,F664 \
            website/ "$DEPLOY_USER@$DEPLOY_HOST:$WEBROOT/"

      - name: Installer herunterladen
        if: needs.build.result == 'success'
        uses: actions/download-artifact@v8
        with:
          path: installers
          pattern: installer-*
          merge-multiple: true

      - name: Installer hochladen
        if: needs.build.result == 'success'
        run: |
          VERSION="${{ needs.changes.outputs.version }}"
          LIVE=$(ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "awk '/^version:/{print \$2}' $WEBROOT/downloads/latest.yml 2>/dev/null" || true)

          # Erst die Installer, danach die Update-Metadaten: electron-updater
          # darf keine Version melden, deren Datei noch nicht vollständig da ist.
          rsync -rlv --chmod=F664 --exclude 'latest*.yml' \
            installers/ "$DEPLOY_USER@$DEPLOY_HOST:$WEBROOT/downloads/"
          rsync -rlv --chmod=F664 \
            installers/latest*.yml "$DEPLOY_USER@$DEPLOY_HOST:$WEBROOT/downloads/"

          {
            echo "## Installer $VERSION veröffentlicht"
            ls -1 installers | sed 's/^/- /'
            if [ "$LIVE" = "$VERSION" ]; then
              echo
              echo "> **Achtung:** Auf dem Server lag bereits $VERSION."
              echo "> Die Dateien wurden ersetzt, aber bestehende Installationen"
              echo "> erhalten kein OTA-Update - dafür muss die Version in"
              echo "> package.json erhöht werden."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Erreichbarkeit prüfen
        run: |
          for url in https://cubory.app/ https://cubory.app/downloads/latest.yml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            echo "$url -> $code"
            [ "$code" = "200" ] || exit 1
          done

  api:
    needs: [changes, test]
    if: |
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      && needs.changes.outputs.backend == 'true' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Binary bauen
        working-directory: backend
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o cubory-api ./cmd/api
      - name: SSH einrichten
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - name: Ausrollen
        run: |
          scp backend/cubory-api "$DEPLOY_USER@$DEPLOY_HOST:/srv/cubory-staging/cubory-api"
          # Das Skript prüft danach /healthz und rollt bei Fehlschlag zurück.
          ssh "$DEPLOY_USER@$DEPLOY_HOST" sudo /usr/local/sbin/cubory-deploy-api
